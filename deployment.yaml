identity:
  prefix: r2d2
## Access Decision Service part of configuration. See Axiomatics documentation
#### Path to license file
license: ${ADS_LICENSE_PATH:./conf/}axiomatics_ADS.license
#### Path to YAML configuration file, "domain.xml" is a sample file.


domain:
  #path: ${ADS_DOMAIN_PATH:-./conf/}domain_${ADS_DOMAIN_NAME:-tutorial}.yaml
  path: ${ADS_DOMAIN_PATH:./conf/}domain.yaml
  #path: http://localhost/api/adm/namespaces/56df8bea-a231-4ac6-9ead-cfeaad5c773a/names/Tutorial/domain
 
  refreshInterval: 10 seconds
  reportNotReadyOnDomainRefreshError: false
  authentication:
    oauth2ClientId: hub-adm-client
engine:
  mode: ads_caq
spring:
  security:
    oauth2:
      client:
        registration:
          hub-adm-client:
            client-id: my-hub-client
            client-secret: nJsucpit30RG6Z2hU5mLltMjhnlWlYGN
            authorization-grant-type: client_credentials
        provider: 
          hub-adm-client:
            token-uri: http://localhost/auth/realms/hub/protocol/openid-connect/token
    user:
      name: ads-user
      password: ${ADS_PASSWORD}
      #password: "{bcrypt}sample value goes here - use env variables"
      #hashPassword:  ${ADS_PASSWORD:-sample value goes here - use env variables}

## Dropwizard part of configuration. See http://www.dropwizard.io/1.3.5/docs/manual/configuration.html
server:
  port: ${ADS_AUTHZ_PORT:8080}

concurrentEvaluation:
  numberOfWorkers: 2
authZen:
  enabled: true
attributeConnectorContext:
    jdbc:
        connectionPool:
            maximumSize: 5
            minimumSize: 2
  #mode: concise (for concise XML)
  #mode: verbose
  #mode: concise_json

audit:
  mode: verbose_json

logging:
  # config: ./conf/logbackSeparateAdminEval.xml
  level:
    root: INFO
    com:
      axiomatics:
        audit: INFO
    "com.axiomatics": INFO    
    #"com.axiomatics.license.LicenseVerifier": INFO   
    #"com.axiomatics.attributeconnector.table": DEBUG
    #"com.axiomatics.attributeconnector.jdbc.SQLAttributeFinder": DEBUG
    #"com.axiomatics.attributeconnector.http": DEBUG
    #"com.axiomatics.attributeconnector.parser.json": DEBUG
    #"shadow.sqlac.com.zaxxer.hikari": DEBUG
